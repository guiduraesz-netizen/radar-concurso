name: Buscar concursos e publicar site

on:
  schedule:
    - cron: "0 10,22 * * *"   # 7h e 19h no horário de Brasília
  workflow_dispatch:
    inputs:
      forcar:
        description: "Reler os detalhes de todos os concursos"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["static/**", "*.py", ".github/workflows/coletar.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-concursos
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar testes
        run: python -m unittest discover tests

      - name: Buscar concursos
        env:
          TZ: America/Sao_Paulo
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python coletar.py --so-publicar
          elif [ "${{ github.event.inputs.forcar }}" = "true" ]; then
            python coletar.py --forcar
          else
            python coletar.py
          fi

      - name: Salvar dados no repositório
        run: |
          git config user.name "radar-concursos-bot"
          git config user.email "radar-concursos-bot@users.noreply.github.com"
          git add dados/cache.json docs
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualiza concursos $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M') [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
